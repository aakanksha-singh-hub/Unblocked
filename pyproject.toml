[project]
name = "unblocked"
version = "0.1.0"
description = "Most overdue invoices are not unpaid, they are stuck. A B2B receivables recovery agent that finds out which."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "playwright>=1.44"]

[project.scripts]
unblocked = "unblocked.cli:app"
unblocked-web = "unblocked.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unblocked"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
